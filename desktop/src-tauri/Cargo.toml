[package]
name = "open-rosalind-desktop"
version = "0.1.0-alpha.6"
description = "Local biomedical research agent"
authors = ["OpenRosalind"]
edition = "2021"

[lib]
name = "open_rosalind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
command-group = "5.0.1"
keyring = "4.1.6"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
